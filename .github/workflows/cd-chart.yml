name: Chart CD

on:
  workflow_dispatch:
    inputs:
      chart_name:
        description: 'Helm chart name'
        required: true
        type: string
      chart_version:
        description: 'Helm chart version'
        required: false
        type: string
        default: ''

jobs:
  cd:
    uses: maxmorhardt/workflows/.github/workflows/cd-helm.yml@main
    with:
      repository: ${{ github.repository }}
      release_name: ${{ github.event.repository.name }}
      namespace: jobs
      chart: oci://docker.io/maxmorhardt/${{ inputs.chart_name }}
      chart_version: ${{ inputs.chart_version }}
    secrets: inherit
