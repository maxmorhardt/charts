name: Chart CI

on:
  push:
    tags:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  discover-charts:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      charts: ${{ steps.discover.outputs.charts }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Discover charts
        id: discover
        run: |
          charts=$(find charts -maxdepth 1 -mindepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(. != ""))')
          echo "charts=${charts}" >> $GITHUB_OUTPUT
          echo "Charts: ${charts}"

  ci-pr:
    needs: discover-charts
    if: github.event_name == 'pull_request'
    strategy:
      matrix:
        chart: ${{ fromJson(needs.discover-charts.outputs.charts) }}
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: ${{ matrix.chart }}
      chart_name: ${{ matrix.chart }}
      working_directory: 'charts'
    secrets: inherit

  tag-parse:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      chart_name: ${{ steps.tag-parse.outputs.chart_name }}
      chart_version: ${{ steps.tag-parse.outputs.chart_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Parse tag
        id: tag-parse
        run: |
          TAG="${{ github.ref_name }}"
          CHART_NAME="${TAG%%/*}"
          CHART_VERSION="${TAG#*/}"
          echo "chart_name=${CHART_NAME}" >> $GITHUB_OUTPUT
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Chart: ${CHART_NAME}, Version: ${CHART_VERSION}"

  ci-tag:
    needs: tag-parse
    if: github.event_name == 'push'
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: ${{ needs.tag-parse.outputs.chart_name }}
      chart_name: ${{ needs.tag-parse.outputs.chart_name }}
      working_directory: 'charts'
      push: ${{ github.event_name == 'push' }}
    secrets: inherit
