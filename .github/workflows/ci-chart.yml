name: Chart CI

on:
  push:
    tags:
      - '**'

jobs:
  tag-parse:
    runs-on: ubuntu-latest
    outputs:
      chart_name: ${{ steps.tag-parse.outputs.chart_name }}
      chart_version: ${{ steps.tag-parse.outputs.chart_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Parse tag
        id: tag-parse
        run: |
          TAG="${{ github.ref_name }}"
          CHART_NAME="${TAG%%/*}"
          CHART_VERSION="${TAG#*/}"
          echo "chart_name=${CHART_NAME}" >> $GITHUB_OUTPUT
          echo "chart_version=${CHART_VERSION}" >> $GITHUB_OUTPUT
          echo "Chart: ${CHART_NAME}, Version: ${CHART_VERSION}"

      - name: Validate chart version
        run: |
          chart_file="charts/${{ steps.tag-parse.outputs.chart_name }}/Chart.yaml"
          version=$(grep '^version:' "$chart_file" | awk '{print $2}')
          if [ "$version" != "${{ steps.tag-parse.outputs.chart_version }}" ]; then
            echo "ERROR: Chart.yaml version ($version) does not match tag version (${{ steps.tag-parse.outputs.chart_version }})"
            exit 1
          fi

  ci:
    needs: tag-parse
    uses: maxmorhardt/workflows/.github/workflows/ci-helm.yml@main
    with:
      repository: ${{ github.repository }}
      chart_directory: ${{ needs.tag-parse.outputs.chart_name }}
      chart_name: ${{ needs.tag-parse.outputs.chart_name }}
      working_directory: 'charts'
    secrets: inherit
